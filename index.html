<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Absolute Cinemas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            text-align: center;
        }
    </style>
</head>
<body class="p-5" data-bs-theme="dark">
    <h1 class="mb-5">Cari Cinema di Cine</h1>
    <form id="searchForm" class="input-group mb-3">
        <input id="searchInput" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
        <button type="submit" class="btn btn-danger input-group-text" id="inputGroup-sizing-default">Search</button>
    </form>

    <div class="container text-center">
        <div class="row row-cols-4" id="movieGrid">
            <div class="col"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script/movie.js"></script>

</html>
