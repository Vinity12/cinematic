<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home • SeekCinema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="scss/color.css">
    <link rel="stylesheet" href="css/global.css">
</head>
<body data-bs-theme="dark"> 
    <header class="position-sticky bg-body-secondary bg-opacity-75 bg-blur top-0 z-3">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand title" href="#">SeekCinema</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#top">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="watchlist.html">Watchlist</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div id="top"></div>

    <main class="py-5 z-0">
        <h3 class="subtitle">Find movies in</h3>
        <h1 class="mb-5 title">SeekCinema</h1>
        <form id="searchForm" class="input-group mb-3 mx-auto" style="width: 90%; max-width: 36rem">
            <input id="searchInput" type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
            <button type="submit" class="btn btn-danger input-group-text z-0" id="inputGroup-sizing-default">Search</button>
        </form>

        <div class="container text-center">
            <div class="row g-4 justify-content-center" id="movieGrid"></div>
            <nav class="mt-4 d-flex justify-content-center">
                <ul class="pagination" id="pagination"></ul>
            </nav>
        </div>
    </main>

    <div class="toast-container position-fixed start-50 translate-middle-x" style="top: 4rem; z-index: 100;">
        <div id="toastElement" class="toast align-items-center" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toastMessage toast-body"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"> </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script/func.js"></script>
    <script src="script/search.js"></script>
</body>
</html>
