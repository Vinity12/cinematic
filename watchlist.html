    <!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Absolute Cinemas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        main {
            text-align: center;
        }

        h1 {
            font-size: 3em;
        }

        .card {
            min-width: 12rem;
            text-align: left;
            box-shadow: 0 10px 16px #00000055;
        }

        .card {
            border-radius: 12px;
        }

        .card-img-top {
            border-radius: 12px 12px 0 0;
        }

        .card-body{
            border-radius: 0 0 12px 12px;
            background-color: #22222288;
            backdrop-filter: blur(30px)
        }
    </style>
</head>
<body onload="loadMovie()" data-bs-theme="dark">
    <header class="position-sticky top-0 z-3">
        <nav class="navbar navbar-expand-lg bg-body-tertiary px-5">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="watchlist.html">Watchlist</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="p-5 z-0">
        <h1 class="mb-5">Your Watchlist</h1>
        <div class="input-group mb-3 mx-auto" style="width: 90%; max-width: 36rem">
            <input id="searchInput" type="text" onkeydown="searchMovie(this.value.trim())" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default">
        </div>

        <div class="container text-center mt-5">
            <div class="row g-4 justify-content-center" id="movieGrid">
            </div>
        </div>
    </main>

    <div class="toast-container position-fixed start-50 translate-middle-x" style="top: 1rem; z-index: 100;">
        <div id="toastElement" class="toast align-items-center" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toastMessage toast-body"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"> </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script/func.js"></script>
    <script src="script/watchlist.js"></script>
</body>
</html>
